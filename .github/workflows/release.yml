# CCB GitHub Actions workflow
# Includes Windows quality checks and tagged Windows release packaging.
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ccb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/proxy-server/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Install proxy-server dependencies
        run: npm ci --prefix src/proxy-server

      - name: Type check
        run: npm run type-check

      - name: Build proxy-server
        run: npm run build --prefix src/proxy-server

      - name: Lint (informational, 渐进治理中)
        # 当前存在 71 个 error（多为 @typescript-eslint/ban-types 的 `{}` 类型与 no-explicit-any），
        # 暂不阻塞 CI，避免一次性卡死构建。治理路线：分批修复后改为阻塞式门禁。
        # 详见 docs/13-项目SDLC规范化分析报告.md 的「质量门禁加固」章节。
        continue-on-error: true
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test -- --run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ github.ref_name }}
          path: coverage/
          if-no-files-found: warn

      - name: Build application
        run: npm run build

  release:
    name: Windows Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/proxy-server/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Install proxy-server dependencies
        run: npm ci --prefix src/proxy-server

      - name: Build proxy-server
        run: npm run build --prefix src/proxy-server

      - name: Build application
        run: npm run build

      - name: Package Windows artifacts
        run: npx electron-builder --win portable zip nsis --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.exe
            release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
