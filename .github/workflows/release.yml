# CCB GitHub Actions workflow
# Includes Windows quality checks and tagged Windows release packaging.
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ccb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code (full history for lint ratchet merge-base)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/proxy-server/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Install proxy-server dependencies
        run: npm ci --prefix src/proxy-server

      - name: Audit production dependencies
        # 生产依赖 0 漏洞为发布门禁（开发链已知项单独跟踪，见 CHANGELOG Release blockers 一节）。
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --prefix src/proxy-server

      - name: Type check
        run: npm run type-check

      - name: Build proxy-server
        run: npm run build --prefix src/proxy-server

      - name: Lint (blocking)
        # 2026-09-04：全量 lint 已清零（历史遗留 71 个 error 已在 v1.5.0 分支消化），
        # 转为阻塞式门禁；lint:changed ratchet 作为变更文件级双重保护保留。
        run: npm run lint

      - name: Lint ratchet (changed files, blocking)
        # 增量门禁：相对 base 分支变更的文件不得新增 lint error（存量不阻塞、不得新增）。
        run: npm run lint:changed

      - name: Run tests with coverage
        run: npm run test -- --run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # PR 事件的 ref_name 形如 "2/merge"，含 "/" 不是合法 artifact 名；用 run_id 规避
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn

      - name: Build application
        run: npm run build

  release:
    name: Windows Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/proxy-server/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Install proxy-server dependencies
        run: npm ci --prefix src/proxy-server

      - name: Build proxy-server
        run: npm run build --prefix src/proxy-server

      - name: Build application
        run: npm run build

      - name: Package Windows artifacts
        run: npx electron-builder --win portable zip nsis --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.exe
            release/*.zip
          # RC 安全惯例：先以 draft 创建，维护者按本地验收清单完成手动验收后再手动 publish。
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
