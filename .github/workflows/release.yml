# CCB GitHub Actions workflow
# Includes Windows quality checks and tagged Windows release packaging.
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ccb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code (full history for lint ratchet merge-base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/proxy-server/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install proxy-server dependencies
        run: npm ci --ignore-scripts --prefix src/proxy-server

      - name: Audit root production dependencies
        run: npm audit --omit=dev

      - name: Audit proxy production dependencies
        run: npm audit --omit=dev --prefix src/proxy-server

      - name: Audit full root build chain
        run: npm audit

      - name: Audit full proxy build chain
        run: npm audit --prefix src/proxy-server

      - name: Release preflight (blocking)
        run: npm run release:preflight

      - name: Install verified Electron runtime
        run: node node_modules/electron/install.js

      - name: Type check
        run: npm run type-check

      - name: Build proxy-server
        run: npm run build --prefix src/proxy-server

      - name: Lint (blocking)
        # 2026-09-04：全量 lint 已清零（历史遗留 71 个 error 已在 v1.5.0 分支消化），
        # 转为阻塞式门禁；lint:changed ratchet 作为变更文件级双重保护保留。
        run: npm run lint

      - name: Lint ratchet (changed files, blocking)
        # 增量门禁：相对 base 分支变更的文件不得新增 lint error（存量不阻塞、不得新增）。
        run: npm run lint:changed

      - name: Run tests with coverage
        run: npm run test -- --run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # PR 事件的 ref_name 形如 "2/merge"，含 "/" 不是合法 artifact 名；用 run_id 规避
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn

      - name: Build application
        run: npm run build

  release:
    name: Windows Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 用户批准 1.5.1 暂缓签名；其他版本继续强制签名。
      CCB_ALLOW_UNSIGNED: ${{ github.ref_name == 'v1.5.1' && 'true' || 'false' }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/proxy-server/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install proxy-server dependencies
        run: npm ci --ignore-scripts --prefix src/proxy-server

      - name: Verify tag and signing configuration
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version' }
          if (!$env:CSC_LINK -and $env:CCB_ALLOW_UNSIGNED -ne 'true') { throw 'CSC_LINK is required for a signed release' }

      - name: Release preflight (blocking)
        run: npm run release:preflight

      - name: Install verified Electron runtime
        run: node node_modules/electron/install.js

      - name: Build proxy-server
        run: npm run build --prefix src/proxy-server

      - name: Build application
        run: npm run build

      - name: Package Windows artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $requireSigning = if ($env:CCB_ALLOW_UNSIGNED -eq 'true') { 'false' } else { 'true' }
          npx --no-install electron-builder --win portable zip nsis --publish=never "--config.forceCodeSigning=$requireSigning"

      - name: Verify Authenticode and ZIP application
        run: ./scripts/verify-release.ps1 -AllowUnsigned:($env:CCB_ALLOW_UNSIGNED -eq 'true')

      - name: Generate dependency SBOMs and SHA-256 manifest
        run: npm run release:metadata

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/*.cdx.json
            release/build-metadata.json
            release/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
            release/*.cdx.json
            release/build-metadata.json
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.cdx.json
            release/build-metadata.json
            release/SHA256SUMS.txt
          # RC 安全惯例：先以 draft 创建，维护者按本地验收清单完成手动验收后再手动 publish。
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
