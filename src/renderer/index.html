<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:;">
  <title>CCB - Claude Code Butler</title>
  <style>
    /* v3 加载界面：跟随用户上次选择的主题（暗/亮），去除原蓝紫渐变 AI 味。
       此处 CSS 在主题系统加载前执行，无法引用主题 CSS 变量，故用 loading 专用变量 +
       data-loading-mode 属性（由下方内联 script 根据 localStorage 设置）。 */
    :root {
      --loading-bg: #1e1e1e;
      --loading-fg: #cccccc;
      --loading-accent: #0e639c;
      --loading-track: rgba(255, 255, 255, 0.15);
    }
    html[data-loading-mode="light"] {
      --loading-bg: #ffffff;
      --loading-fg: #1f2328;
      --loading-accent: #0969da;
      --loading-track: rgba(0, 0, 0, 0.1);
    }

    /* 加载页容器 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--loading-bg);
      color: var(--loading-fg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    .loading-container {
      text-align: center;
    }

    .loading-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      /* 适配亮色加载界面（图标本身可能深色），暗色加载保持原色 */
      filter: var(--loading-logo-filter, none);
    }
    html[data-loading-mode="light"] {
      --loading-logo-filter: none;
    }

    .loading-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .loading-subtitle {
      font-size: 13px;
      opacity: 0.55;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--loading-track);
      border-top: 2px solid var(--loading-accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    /* 错误页面（跟随 loading-mode，保持与加载页视觉一致） */
    #error {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--loading-bg);
      color: var(--loading-fg);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    .error-container {
      text-align: center;
      padding: 40px;
      max-width: 400px;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 14px;
      opacity: 0.65;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .error-button {
      background: var(--loading-accent);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .error-button:hover {
      opacity: 0.85;
    }

    /* 隐藏主要内容 */
    #app {
      display: none;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- 根据上次选择的主题设置加载界面明暗模式（必须在主题系统加载前执行） -->
  <script>
    (function () {
      try {
        var themeId = localStorage.getItem('ccb-ui-theme');
        // 仅 CCB Light 为亮色模式，其余三套（Dark Pro / Minimal / Terminal）均为暗色
        if (themeId === 'ccb-light') {
          document.documentElement.setAttribute('data-loading-mode', 'light');
        }
      } catch (e) {
        // localStorage 不可用时使用默认暗色加载界面
      }
    })();
  </script>

  <!-- 加载页面 -->
  <div id="loading">
    <div class="loading-container">
      <div class="loading-logo"><img src="./src/assets/icons/ccb_256.png" alt="CCB" /></div>
      <div class="loading-text">CCB</div>
      <div class="loading-subtitle">Claude Code Butler</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- 错误页面 -->
  <div id="error">
    <div class="error-container">
      <div class="error-icon">⚠️</div>
      <div class="error-title">应用启动失败</div>
      <div class="error-message" id="errorMessage">
        应用启动时遇到了问题，请重试或联系技术支持。
      </div>
      <button class="error-button" onclick="location.reload()">重新加载</button>
    </div>
  </div>

  <!-- 主应用容器 -->
  <div id="app">
    <div id="root"></div>
  </div>

  <script>
    (function () {
      const loadingDiv = document.getElementById('loading')
      const errorDiv = document.getElementById('error')
      const errorMessage = document.getElementById('errorMessage')

      const showError = (message) => {
        if (loadingDiv) loadingDiv.style.display = 'none'
        if (errorDiv) {
          errorDiv.style.display = 'flex'
          if (errorMessage) errorMessage.textContent = message || '应用启动失败，请重试或联系技术支持。'
        }
      }

      window.__APP_BOOTSTRAPPED__ = false
      window.__APP_BOOT_ERROR__ = (message) => showError(message)

      window.__APP_BOOT_TIMEOUT__ = setTimeout(() => {
        if (!window.__APP_BOOTSTRAPPED__) {
          showError('应用加载超时，请重试或联系技术支持。')
        }
      }, 15000)
    })()
  </script>

  <script type="module" src="/src/main.tsx" onerror="window.__APP_BOOT_ERROR__ && window.__APP_BOOT_ERROR__('应用脚本加载失败，请重试或联系技术支持。')"></script>
</body>
</html>
